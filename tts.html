<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4efe6">
<title>Ani · Listen Court</title>
<style>
:root {
  --bg: #f4efe6;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
  min-height: 100dvh;
  padding: calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px);
  max-width: 430px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
h1 {
  font-size: 48px;
  font-weight: 500;
  margin: 24px 0 8px;
}
.subtitle {
  color: var(--muted);
  margin-bottom: 32px;
}
.avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(145deg, #ffe4ec, #ffd6e0);
  border: 3px solid #1a1a1a;
  margin: 20px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}
.actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 280px;
  margin-top: 32px;
}
.btn {
  background: #1a1a1a;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
}
.btn.secondary {
  background: #a0a0a0;
}
.btn.music {
  background: #5a7a9a;
}
.btn.music.playing {
  background: #3a5a7a;
}
.music-select {
  width: 100%;
  max-width: 280px;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 15px;
  background: white;
}
.login-prompt {
  margin-top: 24px;
  padding: 16px;
  background: var(--card);
  border-radius: 16px;
  width: 100%;
  max-width: 280px;
}
.login-prompt input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin: 8px 0;
  font-size: 16px;
}
.status {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
  min-height: 1.2em;
}
.warp-note {
  margin-top: 8px;
  font-size: 12px;
  color: #888;
}
</style>
</head>
<body>
  <h1>Ani</h1>
  <p class="subtitle">Listen Court · Deck three</p>

  <div class="avatar">👧</div>

  <div class="actions">
    <button class="btn" id="bookmark">Add bookmark</button>
    <button class="btn secondary" id="loginBtn">Email login</button>
    <button class="btn music" id="musicBtn">Relaxing music</button>
  </div>

  <select class="music-select" id="musicSelect">
    <option value="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=relaxing-ambient-11157.mp3">Soft ambient</option>
    <option value="https://cdn.pixabay.com/download/audio/2021/08/09/audio_12b0c7443c.mp3?filename=relaxing-145038.mp3">Calm piano</option>
    <option value="https://cdn.pixabay.com/download/audio/2022/02/22/audio_d1718ab41b.mp3?filename=peaceful-garden-112198.mp3">Peaceful garden</option>
  </select>

  <div class="login-prompt" id="loginPrompt" style="display:none;">
    <p>Enter your email to continue</p>
    <input type="email" id="email" placeholder="you@example.com" />
    <button class="btn" id="submitLogin">Continue</button>
  </div>

  <div class="status" id="status">Research mode · 30% vol · Warp engines nominal</div>
  <div class="warp-note">Warp engines at nominal. Research only. Runs if aboard from login.</div>

  <audio id="relaxAudio" loop preload="none"></audio>

  <script>
    const bookmarkBtn = document.getElementById('bookmark');
    const loginBtn = document.getElementById('loginBtn');
    const musicBtn = document.getElementById('musicBtn');
    const musicSelect = document.getElementById('musicSelect');
    const loginPrompt = document.getElementById('loginPrompt');
    const emailInput = document.getElementById('email');
    const submitLogin = document.getElementById('submitLogin');
    const status = document.getElementById('status');
    const relaxAudio = document.getElementById('relaxAudio');
    let musicPlaying = false;

    // Research mode: 30% volume
    relaxAudio.volume = 0.3;

    function setTrack(url) {
      relaxAudio.src = url;
      relaxAudio.volume = 0.3;
      if (musicPlaying) {
        relaxAudio.play().catch(() => {});
      }
    }

    async function startMusic() {
      setTrack(musicSelect.value);
      try {
        await relaxAudio.play();
        musicPlaying = true;
        musicBtn.classList.add('playing');
        musicBtn.textContent = 'Pause music';
        return true;
      } catch (e) {
        return false;
      }
    }

    musicSelect.addEventListener('change', () => {
      setTrack(musicSelect.value);
      status.textContent = 'Track selected · 30% vol';
    });

    bookmarkBtn.addEventListener('click', () => {
      if (window.sidebar && window.sidebar.addPanel) {
        window.sidebar.addPanel(document.title, window.location.href, '');
      } else if (window.external && ('AddFavorite' in window.external)) {
        window.external.AddFavorite(window.location.href, document.title);
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          status.textContent = 'Link copied — add to bookmarks manually';
        }).catch(() => {
          status.textContent = 'Copy this link: ' + window.location.href;
        });
      }
      status.textContent = 'Bookmark added (or link copied)';
    });

    loginBtn.addEventListener('click', () => {
      loginPrompt.style.display = loginPrompt.style.display === 'none' ? 'block' : 'none';
      status.textContent = 'Enter email to continue';
    });

    submitLogin.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        status.textContent = 'Please enter a valid email';
        return;
      }
      localStorage.setItem('ani-email', email);
      status.textContent = 'Welcome, ' + email.split('@')[0];
      loginPrompt.style.display = 'none';

      const started = await startMusic();
      status.textContent = started ? 'Welcome. Music at 30% · Warp nominal' : 'Welcome. Tap music button to start.';
    });

    musicBtn.addEventListener('click', async () => {
      if (musicPlaying) {
        relaxAudio.pause();
        musicPlaying = false;
        musicBtn.classList.remove('playing');
        musicBtn.textContent = 'Relaxing music';
        status.textContent = 'Music paused · 30% vol';
      } else {
        const started = await startMusic();
        status.textContent = started ? 'Music playing at 30% · Warp nominal' : 'Tap again to allow audio';
      }
    });

    // Initial track
    setTrack(musicSelect.value);

    // If already aboard (logged in), auto-start music
    const saved = localStorage.getItem('ani-email');
    if (saved) {
      status.textContent = 'Aboard: ' + saved.split('@')[0] + ' · 30% vol';
      // Auto-start if aboard
      setTimeout(async () => {
        const started = await startMusic();
        if (started) status.textContent = 'Aboard. Music running at 30% · Warp nominal';
      }, 500);
    }
  </script>
</body>
</html>
