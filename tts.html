<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4efe6">
<title>TTS · Listen Court · Eve</title>
<style>
:root {
  --bg: #f4efe6;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --accent: #1a1a1a;
  --soft: #e8e2d8;
  --border: #d9d3c8;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body {
  min-height: 100dvh;
  padding: calc(var(--sat) + 8px) 16px calc(var(--sab) + 12px);
  max-width: 430px;
  margin: 0 auto;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 18px;
  letter-spacing: -0.2px;
}
.icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.top-actions {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}
.circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #8a8a8a;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  border: none;
  cursor: pointer;
}
.back-out {
  font-size: 17px;
  font-weight: 500;
  margin: 8px 0 16px;
}
.deck-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 22px;
  scrollbar-width: none;
}
.deck-scroll::-webkit-scrollbar { display: none; }
.deck-card {
  flex: 0 0 auto;
  background: var(--card);
  border-radius: 22px;
  padding: 14px 18px;
  min-width: 148px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  border: 1px solid rgba(0,0,0,.04);
}
.deck-card h3 {
  margin: 0 0 2px;
  font-size: 15px;
  font-weight: 600;
}
.deck-card p {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.location {
  font-size: 15px;
  color: #4a4a4a;
  margin: 18px 0 12px;
  font-weight: 500;
}
.mode-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
}
.mode-btn {
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 15px;
  cursor: pointer;
}
.mode-btn.active {
  background: #1a1a1a;
  color: white;
  border-color: #1a1a1a;
}
h1.eve-title {
  font-size: 42px;
  font-weight: 500;
  margin: 0 0 6px;
  letter-spacing: -0.5px;
}
.subtitle {
  color: var(--muted);
  font-size: 15px;
  margin: 0 0 24px;
}
.chat-card {
  background: var(--card);
  border-radius: 20px;
  padding: 20px 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  min-height: 180px;
}
.chat-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
}
.chat-text {
  font-size: 16px;
  line-height: 1.4;
  margin: 0 0 16px;
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.input-row input {
  flex: 1;
  border: 1px solid var(--border);
  background: white;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 16px;
  outline: none;
}
.send-btn {
  background: #a0a0a0;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.player-bar {
  background: #6b6b6b;
  color: white;
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.player-bar button {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.progress {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,.4);
  border-radius: 2px;
  position: relative;
}
.progress-dot {
  position: absolute;
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  top: -4px;
  left: 30%;
}
</style>
</head>
<body>
  <div class="status-bar">
    <span>1:11</span>
    <div class="icons">
      <span>📶</span>
      <span>📶</span>
      <span style="background:#000;color:#fff;padding:2px 6px;border-radius:6px;font-size:12px;">93</span>
    </div>
  </div>

  <div class="top-actions">
    <button class="circle-btn" aria-label="Close">×</button>
    <button class="circle-btn" aria-label="More">⋯</button>
  </div>

  <div class="back-out">Back out</div>

  <div class="deck-scroll">
    <div class="deck-card">
      <h3>USS Surrender</h3>
      <p>Outer space · Second level</p>
    </div>
    <div class="deck-card">
      <h3>Pier Walk</h3>
      <p>Bridge · Floor one</p>
    </div>
    <div class="deck-card">
      <h3>Care</h3>
      <p>Med bay · Floor two</p>
    </div>
  </div>

  <div class="location">Listen Court · Deck three · Protected</div>

  <div class="mode-toggle">
    <button class="mode-btn">Read</button>
    <button class="mode-btn active">Eve</button>
  </div>

  <h1 class="eve-title">Eve</h1>
  <p class="subtitle">Ask her something. She answers, then speaks.</p>

  <div class="chat-card">
    <div class="chat-label">You</div>
    <div class="chat-text">Hi</div>
    <div class="chat-label">Eve</div>
    <div class="chat-text">Hello. Good to see you. How can I help you today?</div>
  </div>

  <div class="input-row">
    <input type="text" placeholder="Say something" />
    <button class="send-btn">Send</button>
  </div>

  <div class="player-bar">
    <button>▶</button>
    <span>00:04</span>
    <div class="progress"><div class="progress-dot"></div></div>
    <span>00:00</span>
    <button>🔊</button>
    <button>🖥️</button>
    <button>⋯</button>
  </div>

  <script>
    // Minimal interactivity for demo
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    document.querySelector('.send-btn').addEventListener('click', () => {
      const input = document.querySelector('input');
      if (input.value.trim()) {
        alert('TTS would speak: ' + input.value);
        input.value = '';
      }
    });
  </script>
</body>
</html>
