<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4efe6">
<title>Ani · Listen Court</title>
<style>
:root {
  --bg: #f4efe6;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
body {
  min-height: 100dvh;
  padding: calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px);
  max-width: 430px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
h1 {
  font-size: 48px;
  font-weight: 500;
  margin: 24px 0 8px;
}
.subtitle {
  color: var(--muted);
  margin-bottom: 32px;
}
.ship-tube {
  width: 180px;
  height: 80px;
  margin: 20px 0;
}
.actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 280px;
  margin-top: 32px;
}
.btn {
  background: #1a1a1a;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
}
.btn.secondary {
  background: #a0a0a0;
}
.btn.music {
  background: #2f6fad;
  font-size: 18px;
  padding: 18px;
  min-height: 56px;
}
.btn.music.playing {
  background: #1f4f7d;
}
.btn.music.disabled {
  background: #888;
  opacity: 0.6;
}
.btn.music:focus-visible {
  outline: 3px solid #88ccff;
  outline-offset: 2px;
}
.music-select {
  width: 100%;
  max-width: 280px;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 15px;
  background: white;
}
.login-prompt {
  margin-top: 24px;
  padding: 16px;
  background: var(--card);
  border-radius: 16px;
  width: 100%;
  max-width: 280px;
}
.login-prompt input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin: 8px 0;
  font-size: 16px;
}
.settings-row {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--muted);
}
.status {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
  min-height: 1.2em;
}
.warp-note {
  margin-top: 8px;
  font-size: 12px;
  color: #888;
}
.mssql-note {
  margin-top: 4px;
  font-size: 11px;
  color: #aaa;
}
</style>
</head>
<body>
  <h1>Ani</h1>
  <p class="subtitle">Listen Court · Deck three</p>

  <!-- Tube graphic as the ship -->
  <svg class="ship-tube" viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4a6a8a"/>
        <stop offset="50%" stop-color="#7aa0c0"/>
        <stop offset="100%" stop-color="#4a6a8a"/>
      </linearGradient>
    </defs>
    <rect x="10" y="25" width="160" height="30" rx="15" fill="url(#tubeGrad)" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="70" y="15" width="40" height="15" rx="4" fill="#3a5a7a" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="25" cy="40" r="6" fill="#88ccff" opacity="0.8"/>
    <circle cx="155" cy="40" r="6" fill="#88ccff" opacity="0.8"/>
    <line x1="40" y1="25" x2="40" y2="55" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="90" y1="25" x2="90" y2="55" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="140" y1="25" x2="140" y2="55" stroke="#1a1a1a" stroke-width="1"/>
    <text x="90" y="72" text-anchor="middle" font-size="10" fill="#666">USS Surrender</text>
  </svg>

  <div class="actions">
    <button class="btn" id="bookmark">Add bookmark</button>
    <button class="btn secondary" id="loginBtn">Email login</button>
    <button class="btn music" id="musicBtn" type="button">Play music</button>
  </div>

  <select class="music-select" id="musicSelect">
    <option value="audio/ambient/calm-drift.mp3">Calm drift</option>
    <option value="audio/ambient/deep-space-pad.mp3">Deep space pad</option>
    <option value="audio/ambient/ocean-hum.mp3">Ocean hum</option>
  </select>

  <div class="settings-row">
    <input type="checkbox" id="musicDisabled" />
    <label for="musicDisabled">Disable music</label>
  </div>

  <div class="login-prompt" id="loginPrompt" style="display:none;">
    <p>Enter your regular email to continue</p>
    <input type="email" id="email" placeholder="you@example.com" value="pianomanuel@gmail.com" />
    <button class="btn" id="submitLogin">Continue</button>
  </div>

  <div class="status" id="status">Tap Play music to start · Warp engines nominal</div>
  <div class="warp-note">Warp engines at nominal. On iPhone/Safari, tap Play music once to start audio.</div>
  <div class="mssql-note">Ship structure built parallel to normal MSSQL (decks, levels, objects).</div>

  <audio id="relaxAudio" loop preload="auto" playsinline>
    <source id="relaxSource" src="audio/ambient/calm-drift.mp3" type="audio/mpeg">
  </audio>

  <script>
    const bookmarkBtn = document.getElementById('bookmark');
    const loginBtn = document.getElementById('loginBtn');
    const musicBtn = document.getElementById('musicBtn');
    const musicSelect = document.getElementById('musicSelect');
    const musicDisabledCheckbox = document.getElementById('musicDisabled');
    const loginPrompt = document.getElementById('loginPrompt');
    const emailInput = document.getElementById('email');
    const submitLogin = document.getElementById('submitLogin');
    const status = document.getElementById('status');
    const relaxAudio = document.getElementById('relaxAudio');
    const relaxSource = document.getElementById('relaxSource');
    let musicPlaying = false;
    let musicDisabled = localStorage.getItem('ani-music-disabled') === 'true';
    let loadFallbackInFlight = false;
    let fallbackAttempts = 0;
    // Default 0.6: iOS Safari ignores element.volume, so files are loudness-normalized instead.
    const DEFAULT_VOLUME = 0.6;

    function trackLabel(url) {
      const opt = Array.from(musicSelect.options).find(o => o.value === url);
      return opt ? opt.textContent.trim() : (url.split('/').pop() || 'track');
    }

    function currentTrackIndex() {
      return Math.max(0, musicSelect.selectedIndex);
    }

    function updateMusicUI() {
      musicDisabledCheckbox.checked = musicDisabled;
      if (musicDisabled) {
        musicBtn.classList.add('disabled');
        musicBtn.textContent = 'Music disabled';
        musicSelect.disabled = true;
        if (musicPlaying) {
          relaxAudio.pause();
          musicPlaying = false;
          musicBtn.classList.remove('playing');
        }
      } else {
        musicBtn.classList.remove('disabled');
        musicBtn.textContent = musicPlaying ? 'Pause music' : 'Play music';
        musicSelect.disabled = false;
      }
    }

    relaxAudio.volume = DEFAULT_VOLUME;
    relaxAudio.loop = true;
    try { relaxAudio.setAttribute('playsinline', ''); } catch (_) {}

    function setTrack(url, { reload = true } = {}) {
      if (musicDisabled) return;
      const absHint = url;
      if (relaxSource) {
        relaxSource.src = absHint;
        relaxSource.type = 'audio/mpeg';
      }
      // Keep audio.src in sync for browsers that ignore nested <source> after first load
      relaxAudio.src = absHint;
      relaxAudio.volume = DEFAULT_VOLUME;
      if (reload) {
        try { relaxAudio.load(); } catch (_) {}
      }
    }

    function tryNextTrack(failedUrl) {
      if (musicDisabled || loadFallbackInFlight) return;
      const options = Array.from(musicSelect.options);
      if (!options.length) return;
      if (fallbackAttempts >= options.length) {
        status.textContent = "Couldn't load any ambient tracks";
        musicPlaying = false;
        musicBtn.classList.remove('playing');
        musicBtn.textContent = 'Play music';
        return;
      }
      fallbackAttempts += 1;
      const failedIdx = options.findIndex(o => o.value === failedUrl);
      const startIdx = failedIdx >= 0 ? failedIdx : currentTrackIndex();
      const nextIdx = (startIdx + 1) % options.length;
      const next = options[nextIdx].value;
      musicSelect.selectedIndex = nextIdx;
      status.textContent = "Couldn't load track " + trackLabel(failedUrl) + ' — trying next';
      loadFallbackInFlight = true;
      setTrack(next);
      const onReady = () => {
        relaxAudio.removeEventListener('canplay', onReady);
        loadFallbackInFlight = false;
        // Do not auto-call play here on iOS without a fresh user gesture.
        status.textContent = "Couldn't load track " + trackLabel(failedUrl) + ' — tap Play for ' + trackLabel(next);
      };
      relaxAudio.addEventListener('canplay', onReady, { once: true });
      setTimeout(() => { loadFallbackInFlight = false; }, 4000);
    }

    function markPlaying(url) {
      musicPlaying = true;
      musicBtn.classList.add('playing');
      musicBtn.textContent = 'Pause music';
      fallbackAttempts = 0;
      status.textContent = 'Playing: ' + trackLabel(url);
    }

    function markPaused(msg) {
      musicPlaying = false;
      musicBtn.classList.remove('playing');
      musicBtn.textContent = 'Play music';
      if (msg) status.textContent = msg;
    }

    // Call play() directly from a user-gesture handler (Safari/iOS requirement).
    function playFromUserGesture() {
      if (musicDisabled) return Promise.resolve(false);
      const url = musicSelect.value;
      // Only reset src if needed — preserve gesture chain when already loaded.
      const current = (relaxSource && relaxSource.getAttribute('src')) || '';
      if (current !== url || !relaxAudio.src) {
        setTrack(url, { reload: true });
      }
      relaxAudio.volume = DEFAULT_VOLUME;
      const playPromise = relaxAudio.play();
      if (!playPromise || typeof playPromise.then !== 'function') {
        markPlaying(url);
        return Promise.resolve(true);
      }
      return playPromise.then(() => {
        markPlaying(url);
        return true;
      }).catch((e) => {
        const name = (e && e.name) || '';
        if (name === 'NotAllowedError') {
          markPaused('Tap Play to start music (browser blocked autoplay)');
        } else {
          markPaused('Tap Play music to start');
        }
        return false;
      });
    }

    relaxAudio.addEventListener('error', () => {
      if (musicDisabled) return;
      const failed = musicSelect.value;
      status.textContent = "Couldn't load track " + trackLabel(failed) + ' — trying next';
      tryNextTrack(failed);
    });

    musicDisabledCheckbox.addEventListener('change', () => {
      musicDisabled = musicDisabledCheckbox.checked;
      localStorage.setItem('ani-music-disabled', musicDisabled ? 'true' : 'false');
      updateMusicUI();
      status.textContent = musicDisabled ? 'Music disabled' : 'Music enabled · tap Play';
    });

    musicSelect.addEventListener('change', () => {
      if (musicDisabled) return;
      loadFallbackInFlight = false;
      fallbackAttempts = 0;
      setTrack(musicSelect.value);
      status.textContent = 'Track selected: ' + trackLabel(musicSelect.value) + ' · tap Play';
      // Changing track while playing: try continue, but may need another tap on iOS.
      if (musicPlaying) {
        playFromUserGesture();
      }
    });

    bookmarkBtn.addEventListener('click', () => {
      if (window.sidebar && window.sidebar.addPanel) {
        window.sidebar.addPanel(document.title, window.location.href, '');
      } else if (window.external && ('AddFavorite' in window.external)) {
        window.external.AddFavorite(window.location.href, document.title);
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          status.textContent = 'Link copied — add to bookmarks manually';
        }).catch(() => {
          status.textContent = 'Copy this link: ' + window.location.href;
        });
      }
      status.textContent = 'Bookmark added (or link copied)';
    });

    loginBtn.addEventListener('click', () => {
      loginPrompt.style.display = loginPrompt.style.display === 'none' ? 'block' : 'none';
      status.textContent = 'Enter regular email to continue';
    });

    submitLogin.addEventListener('click', () => {
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        status.textContent = 'Please enter a valid email';
        return;
      }
      localStorage.setItem('ani-email', email);
      loginPrompt.style.display = 'none';
      if (musicDisabled) {
        status.textContent = 'Welcome, ' + email.split('@')[0] + '. Music disabled.';
        return;
      }
      // Start music in THIS click handler so Safari treats it as a user gesture.
      playFromUserGesture().then((started) => {
        if (started) {
          status.textContent = 'Welcome. Playing: ' + trackLabel(musicSelect.value);
        } else {
          status.textContent = 'Welcome, ' + email.split('@')[0] + '. Tap Play music to start.';
        }
      });
    });

    musicBtn.addEventListener('click', () => {
      if (musicDisabled) {
        status.textContent = 'Music is disabled. Uncheck the box to enable.';
        return;
      }
      if (musicPlaying && !relaxAudio.paused) {
        relaxAudio.pause();
        markPaused('Music paused · tap Play to resume');
        return;
      }
      // Direct play() from the click handler — required on iOS Safari.
      playFromUserGesture();
    });

    // Prepare first track (do not autoplay; Safari will block it).
    if (!musicDisabled) setTrack(musicSelect.value, { reload: true });
    updateMusicUI();

    const saved = localStorage.getItem('ani-email');
    if (saved) {
      status.textContent = 'Aboard: ' + saved.split('@')[0] + (musicDisabled ? ' · music disabled' : ' · tap Play music');
      // Attempt autoplay only as a soft convenience; never rely on it for Safari/iOS.
      if (!musicDisabled) {
        setTimeout(() => {
          const p = relaxAudio.play();
          if (p && typeof p.then === 'function') {
            p.then(() => markPlaying(musicSelect.value)).catch(() => {
              status.textContent = 'Aboard: ' + saved.split('@')[0] + ' · tap Play music to start';
            });
          }
        }, 300);
      }
    }
  </script>
</body>
</html>
