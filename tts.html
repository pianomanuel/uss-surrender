<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>Ani · Listen Court</title>
<style>
body{margin:0;background:#f4efe6;color:#1a1a1a;font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:48px 20px;}
h1{font-size:48px;font-weight:500;margin:0 0 6px}
p{color:#6b6b6b;margin:0 0 36px}
button{display:block;width:100%;max-width:300px;margin:0 auto 14px;padding:20px;font-size:20px;border:0;border-radius:16px;background:#2f6fad;color:#fff}
button.on{background:#1f4f7d}
select{width:100%;max-width:300px;padding:14px;font-size:17px;border-radius:12px;border:1px solid #ccc;background:#fff}
#status{margin-top:22px;color:#555;font-size:16px;min-height:1.4em}
.tip{margin-top:28px;font-size:13px;color:#888}
</style>
</head>
<body>
<h1>Ani</h1>
<p>Listen Court</p>
<button id="play" type="button">Play music</button>
<select id="track">
  </select>
<div id="status">Tap Play music</div>
<div class="tip">No sound on iPhone? Turn up the volume and check the side switch isn't on silent.</div>
<audio id="a" loop playsinline preload="auto"></audio>
<script>
localStorage.removeItem('ani-music-disabled');
const a=document.getElementById('a'),b=document.getElementById('play'),t=document.getElementById('track'),s=document.getElementById('status');
function name(){return t.options[t.selectedIndex].text}
b.onclick=function(){
  if(!a.paused){a.pause();b.textContent='Play music';b.classList.remove('on');s.textContent='Paused';return;}
  a.play().then(function(){b.textContent='Pause music';b.classList.add('on');s.textContent='Playing: '+name();})
   .catch(function(e){s.textContent='Could not play ('+(e&&e.name||'error')+'). Tap again.';});
};
t.onchange=function(){var was=!a.paused;a.src=t.value;s.textContent=name()+' selected';if(was){a.play().catch(function(){s.textContent='Tap Play music';});}};
a.onerror=function(){s.textContent='Track failed to load. Pick another.';};
</script>
</body>
</html>
