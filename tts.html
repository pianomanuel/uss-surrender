<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4efe6">
<title>TTS · Listen Court · Eve</title>
<style>
:root {
  --bg: #f4efe6;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --accent: #1a1a1a;
  --soft: #e8e2d8;
  --border: #d9d3c8;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body {
  min-height: 100dvh;
  padding: calc(var(--sat) + 8px) 16px calc(var(--sab) + 12px);
  max-width: 430px;
  margin: 0 auto;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 18px;
  letter-spacing: -0.2px;
}
.icons { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.top-actions {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}
.circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #8a8a8a;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  border: none;
  cursor: pointer;
}
.back-out {
  font-size: 17px;
  font-weight: 500;
  margin: 8px 0 16px;
}
.deck-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 22px;
  scrollbar-width: none;
}
.deck-scroll::-webkit-scrollbar { display: none; }
.deck-card {
  flex: 0 0 auto;
  background: var(--card);
  border-radius: 22px;
  padding: 14px 18px;
  min-width: 148px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  border: 1px solid rgba(0,0,0,.04);
}
.deck-card h3 {
  margin: 0 0 2px;
  font-size: 15px;
  font-weight: 600;
}
.deck-card p {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.location {
  font-size: 15px;
  color: #4a4a4a;
  margin: 18px 0 12px;
  font-weight: 500;
}
.mode-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
}
.mode-btn {
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  font-size: 15px;
  cursor: pointer;
}
.mode-btn.active {
  background: #1a1a1a;
  color: white;
  border-color: #1a1a1a;
}
h1.eve-title {
  font-size: 42px;
  font-weight: 500;
  margin: 0 0 6px;
  letter-spacing: -0.5px;
}
.subtitle {
  color: var(--muted);
  font-size: 15px;
  margin: 0 0 24px;
}
.chat-card {
  background: var(--card);
  border-radius: 20px;
  padding: 20px 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  min-height: 180px;
  max-height: 280px;
  overflow-y: auto;
}
.chat-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
}
.chat-text {
  font-size: 16px;
  line-height: 1.4;
  margin: 0 0 16px;
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.input-row input {
  flex: 1;
  border: 1px solid var(--border);
  background: white;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 16px;
  outline: none;
}
.send-btn {
  background: #a0a0a0;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.send-btn:active { background: #888; }
.player-bar {
  background: #6b6b6b;
  color: white;
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.player-bar button {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.progress {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,.4);
  border-radius: 2px;
  position: relative;
}
.progress-dot {
  position: absolute;
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  top: -4px;
  left: 30%;
}
.speaking { opacity: 0.7; }
</style>
</head>
<body>
  <div class="status-bar">
    <span>1:11</span>
    <div class="icons">
      <span>📶</span>
      <span>📶</span>
      <span style="background:#000;color:#fff;padding:2px 6px;border-radius:6px;font-size:12px;">93</span>
    </div>
  </div>

  <div class="top-actions">
    <button class="circle-btn" aria-label="Close">×</button>
    <button class="circle-btn" aria-label="More">⋯</button>
  </div>

  <div class="back-out">Back out</div>

  <div class="deck-scroll">
    <div class="deck-card">
      <h3>USS Surrender</h3>
      <p>Outer space · Second level</p>
    </div>
    <div class="deck-card">
      <h3>Pier Walk</h3>
      <p>Bridge · Floor one</p>
    </div>
    <div class="deck-card">
      <h3>Care</h3>
      <p>Med bay · Floor two</p>
    </div>
  </div>

  <div class="location">Listen Court · Deck three · Protected</div>

  <div class="mode-toggle">
    <button class="mode-btn">Read</button>
    <button class="mode-btn active">Eve</button>
  </div>

  <h1 class="eve-title">Eve</h1>
  <p class="subtitle">Ask her something. She answers, then speaks.</p>

  <div class="chat-card" id="chat">
    <div class="chat-label">You</div>
    <div class="chat-text">Hi</div>
    <div class="chat-label">Eve</div>
    <div class="chat-text">Hello. Good to see you. How can I help you today?</div>
  </div>

  <div class="input-row">
    <input type="text" id="input" placeholder="Say something" />
    <button class="send-btn" id="send">Send</button>
  </div>

  <div class="player-bar" id="player">
    <button id="playBtn">▶</button>
    <span id="time">00:00</span>
    <div class="progress"><div class="progress-dot" id="dot"></div></div>
    <span>00:00</span>
    <button>🔊</button>
    <button>🖥️</button>
    <button>⋯</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const player = document.getElementById('player');
    const timeEl = document.getElementById('time');
    const playBtn = document.getElementById('playBtn');

    // Mode toggle
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    function addMessage(label, text) {
      const labelEl = document.createElement('div');
      labelEl.className = 'chat-label';
      labelEl.textContent = label;
      const textEl = document.createElement('div');
      textEl.className = 'chat-text';
      textEl.textContent = text;
      chat.appendChild(labelEl);
      chat.appendChild(textEl);
      chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
      if (!window.speechSynthesis) {
        alert('Speech synthesis not supported in this browser.');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      // Prefer a female / soft voice if available
      const voices = speechSynthesis.getVoices();
      const female = voices.find(v => /female|samantha|victoria|karen|moira|fiona|zira|susan/i.test(v.name)) || voices.find(v => v.lang.startsWith('en'));
      if (female) utter.voice = female;
      utter.rate = 0.95;
      utter.pitch = 1.05;

      utter.onstart = () => {
        player.classList.add('speaking');
        playBtn.textContent = '⏸';
        timeEl.textContent = 'speaking…';
      };
      utter.onend = () => {
        player.classList.remove('speaking');
        playBtn.textContent = '▶';
        timeEl.textContent = '00:00';
      };
      utter.onerror = () => {
        player.classList.remove('speaking');
        playBtn.textContent = '▶';
      };

      speechSynthesis.speak(utter);
    }

    function generateEveReply(userText) {
      const lower = userText.toLowerCase();
      if (lower.includes('hello') || lower.includes('hi')) return 'Hello again. I\'m here.';
      if (lower.includes('how are you')) return 'I\'m steady. Ready when you are.';
      if (lower.includes('name')) return 'I\'m Eve. On Listen Court, deck three.';
      if (lower.includes('help')) return 'Tell me what you need. I\'ll answer, then speak it.';
      return 'I heard you. ' + userText + '. What would you like next?';
    }

    function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addMessage('You', text);
      input.value = '';
      const reply = generateEveReply(text);
      addMessage('Eve', reply);
      speak(reply);
    }

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSend();
    });

    // Load voices (some browsers need this)
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => {};
    }

    // Play button stops current speech
    playBtn.addEventListener('click', () => {
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
      }
    });
  </script>
</body>
</html>
