name: Static site CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check explicit publish manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run synthetic publish-boundary regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate only the approved publish manifest
        run: python scripts/check_static_site.py --manifest .github/publish-manifest.json
