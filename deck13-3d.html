<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071018">
<link rel="manifest" href="manifest.webmanifest">
<title>Phoenix Flare — Deck 13 3D</title>
<style>
html,body{margin:0;height:100%;background:#071018;color:#d7eef6;font-family:-apple-system,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;touch-action:none}
.hud{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:2}
.row{display:flex;gap:8px}
button{flex:1;padding:12px 8px;border:1px solid #2a5160;background:#0b1820cc;color:#c9f4ff;border-radius:6px;font-size:13px}
.tag{position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;z-index:2;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7ee7ff}
#status{margin-top:8px;font-size:12px;color:#9ec4d2;min-height:1.3em}
</style>
</head>
<body>
<div class="tag">Phoenix Flare · static 3D sim</div>
<canvas id="c"></canvas>
<div class="hud">
  <div class="row">
    <button data-mode="fall">Fall</button>
    <button data-mode="heal">Heal</button>
    <button data-mode="rise">Rise</button>
  </div>
  <div id="status">Drag to orbit. Pinch later if you add it. Same cabin on phone, site, and web app.</div>
</div>
<script src="three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071018);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(4.2, 3.2, 5.2);

const room = new THREE.Group();
scene.add(room);

function box(w,h,d,color,x,y,z){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness: 0.08 })
  );
  m.position.set(x,y,z);
  room.add(m);
  return m;
}

box(8,0.08,8,0x3d2a1c,0,0,0);          // floor
box(8,3.2,0.08,0xf3d7a4,0,1.6,-4);     // back wall
box(0.08,3.2,8,0xe8c98a,-4,1.6,0);     // left
box(0.08,3.2,8,0xd4b07a,4,1.6,0);      // right
box(2.4,0.4,1.3,0x7a3040,-1.6,0.35,1.2); // bunk
box(2.2,0.18,1.1,0xc9a0a8,-1.6,0.58,1.2);
box(0.5,1.1,0.5,0x2e6b6b,2.1,0.6,-1.4); // chair
const blade = box(1.6,0.04,0.12,0x9aa4a8,0,2.85,0);
const crossV = box(0.06,0.4,0.04,0xc9a227,1.6,1.7,-3.85);
const crossH = box(0.22,0.06,0.04,0xc9a227,1.6,1.78,-3.85);

const key = new THREE.PointLight(0xffd8b0, 18, 16);
key.position.set(-1.5, 2.4, 2);
scene.add(key);
const fill = new THREE.HemisphereLight(0x7ee7ff, 0x1a120c, 0.55);
scene.add(fill);
const lamp = new THREE.PointLight(0x7ee7ff, 4, 10);
lamp.position.set(2.2, 2.2, -1);
scene.add(lamp);

const modes = {
  fall: { bg: 0x071018, key: 0xffc8a0, keyI: 16, copy: 'The Fall. Bunk. Lift failed on purpose.' },
  heal: { bg: 0x1a1014, key: 0xffa0b4, keyI: 12, copy: 'The Healing. Chair occupied. Stay in the room.' },
  rise: { bg: 0x0e2430, key: 0xf0c14a, keyI: 22, copy: 'The Rising. Hands free. The ship still flies.' }
};
function applyMode(name){
  const m = modes[name];
  scene.background.set(m.bg);
  key.color.set(m.key);
  key.intensity = m.keyI;
  document.getElementById('status').textContent = m.copy + ' Drag to orbit.';
}
applyMode('fall');
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => applyMode(b.dataset.mode));

let dragging = false, lx = 0, ly = 0, yaw = 0.55, pitch = 0.35;
canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('pointermove', e => {
  if(!dragging) return;
  yaw -= (e.clientX - lx) * 0.005;
  pitch = Math.max(0.12, Math.min(1.1, pitch + (e.clientY - ly) * 0.004));
  lx = e.clientX; ly = e.clientY;
});

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function frame(t){
  blade.rotation.y = t * 0.0012;
  const r = 6.2;
  camera.position.x = Math.sin(yaw) * r * Math.cos(pitch);
  camera.position.z = Math.cos(yaw) * r * Math.cos(pitch);
  camera.position.y = 1.4 + Math.sin(pitch) * 4.2;
  camera.lookAt(0, 1.1, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
